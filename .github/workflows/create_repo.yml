name: create-repo
on:
  workflow_dispatch:
    inputs:
      prefix: # 입력값이름
        description: 'set repo prefix'
        required: true # true니깐 필수 입력값
        depault: 'service'
        type: choice
        options:
        - example
        - service 
      name:
        description: 'set repo name'
        required: true
        default: 'github-actions'
        type: string  

jobs:
  create-repo-auto:
    runs-on: ubuntu-latest
    steps:
    - name: gh auth login # 토큰을 통한 깃헙 권한 얻기. gh auth login  로그인해라!
      run: |
        echo ${{ secrets.PERSONAL_ACCESS_TOKEN }} | gh auth login --with-token
    - name: create-repo
      run: |
        gh repo create gpactionT/${{ inputs.prefix }}-${{ inputs.name }} --public --add-readme