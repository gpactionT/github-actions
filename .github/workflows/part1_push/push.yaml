# 푸시발생 시 pushjob이라는 잡이 실행되고 첫번쨰스텝으로 echo 헬로월드 출력

name: push-workflow # 액션창에서 표현될 시각화 이름
on: push # 푸쉬이벤트 발생시 트리거하겠다.

jobs:
  push-job: # 잡 이름
    runs-on: ubuntu-latest # 우분투에서 실행
    steps:
    - name: step1
      run: echo hello world 
    - name: step2
      run: | # 여러줄을 한줄로 묶겠다.
        echo hello world 2
        echo github actions!
