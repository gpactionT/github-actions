# 잡레벨과 스텝레벨의 if조건문 가능
# if문은 트리거 된후 잡과 스텝을 관리하는거라면
# filter는 트리거 발동에 대한 관리

name: if-1
on:
  push:
  workflow_dispatch:

jobs:
  job1: # 푸쉬일때 액션 실행
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
    - name: get event name
      run: echo ${{ github.event_name }}

  job2: # 푸시가 아닐떄 액션 실행
    runs-on: ubuntu-latest
    if: github.event_name != 'push'
    steps:
    - name: get event name
      run: echo ${{ github.event_name }} 

  job3: # 푸시가 아닐떄 액션 실행
    runs-on: ubuntu-latest
    if: github.event_name != 'push'
    steps:
    - name: get event name
      if: github.event_name == 'push'
      run: echo "PUSH"
    - name: get event name
      if: github.event_name != 'push'
      run: echo "WORKFLOW_DISPATCH"       