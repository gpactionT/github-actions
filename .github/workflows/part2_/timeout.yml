name: timeout
on: push # 푸쉬할떄 액션 실행

jobs:
  timeout:
    runs-on: ubuntu-latest
    timeout-minutes: 2 # 2분안에 종료해라!
    steps:
    - name: loop # 1초에 1씩 카운팅되는 무한루프
      run: |
        count=0
        while true; do
          echo "seconds: $count"
          count=$((count+1))
          sleep 1
        done
      timeout-minutes: 1
    - name: echo
      run: echo hello!
# 2분안에 잡이 못끝내면 종료
# 1스텝인 loop이 1분안에 못끝내서 에코스텝은 시작도 못하고 끝.