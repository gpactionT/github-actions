# 환경변수 설정. 워크플로우 내에서만 사요가능
# 워크플로우레벨, 잡레벨, 스텝레벨에ㅓ 환경변수 설정 가능
# 적용순서는 스텝레벨 > 잡레벨 > 워크플로우 순

name: var-1
on: push

env:
  level: workflow

jobs:
  get-env-1:
    runs-on: ubuntu-latest
    steps:
    - name: check env
    run: echo "level ${{ env.level}}" # level workflow 출력
  get-env-2:
    runs-on: ubuntu-latest
    env:
      level: job
    steps:
    - name: check env
      run: echo "level ${{ env.level}}" # level job 출력
  get_var:
    runs-on: ubuntu-latest
    steps:
    - name: get var
      run: echo ${{ vars.level }} # 웹사이트에서 설정한 level 변수 가져오기.