# artifact
# 워크플로우 중 발생한 파일 모음
# 잡 실행동안 서로의 데이터를 공유가능
name: aritfact
on: push

jobs:
  upload-artifact_j:
    runs-on: ubuntu-latest
    steps:
    - name: echo
      run: echo hello-world > hello.txt # hello.txt 파일에 hello-world가 들어가도록
    - name: upload artifact
      uses: actions/upload-artifact@v3 # 업로드아티팩 버전3 가져와
      with: # 인풋값 설정
        name: artifact-test
        paths: ./hello.txt # hello.txㅅ 파일을 artifact에 넣어라!
  
  download-artifact:
    runs-on: ubuntu-latest
    needs: [upload-artifact_j] # 1번 잡이 완료되고 실행되도록 의존성 추가
    steps:
    - name: download artifact
      uses: actions/download-artifact@v3
      with:
        name: artifact-test
        path: ./ # 현재 경로에 파일을 다운로드해
    - name: check
      run: cat hello.txt # hello 파일을 실행해라!!